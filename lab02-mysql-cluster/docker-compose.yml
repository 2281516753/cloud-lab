services:
  mysql-master:
    image: mysql:8.0
    container_name: mysql-master
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: testdb
      MYSQL_USER: app
      MYSQL_PASSWORD: app123
    ports:
      - "3306:3306"
    volumes:
      - mysql-master-data:/var/lib/mysql
      - ./master.cnf:/etc/mysql/conf.d/custom.cnf
    networks:
      - mysql-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  mysql-slave:
    image: mysql:8.0
    container_name: mysql-slave
    environment:
      MYSQL_ROOT_PASSWORD: root123
    ports:
      - "3307:3306"
    volumes:
      - mysql-slave-data:/var/lib/mysql
      - ./slave.cnf:/etc/mysql/conf.d/custom.cnf
    networks:
      - mysql-net
    depends_on:
      mysql-master:
        condition: service_healthy

  proxysql:
    image: proxysql/proxysql:2.6
    container_name: proxysql
    ports:
      - "6033:6033"   # MySQL proxy port
      - "6032:6032"   # Admin port
    volumes:
      - ./proxysql.cnf:/etc/proxysql.cnf
    networks:
      - mysql-net
    depends_on:
      - mysql-master
      - mysql-slave

volumes:
  mysql-master-data:
  mysql-slave-data:

networks:
  mysql-net:
    driver: bridge
