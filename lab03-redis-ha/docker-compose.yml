services:
  redis-master:
    image: redis:7-alpine
    container_name: redis-master
    command: redis-server --port 6379 --requirepass redis123 --masterauth redis123
    ports:
      - "6379:6379"
    volumes:
      - redis-master-data:/data
    networks:
      - redis-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redis123", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis-replica-1:
    image: redis:7-alpine
    container_name: redis-replica-1
    command: redis-server --port 6379 --requirepass redis123 --masterauth redis123 --replicaof redis-master 6379
    ports:
      - "6380:6379"
    volumes:
      - redis-replica1-data:/data
    networks:
      - redis-net
    depends_on:
      redis-master:
        condition: service_healthy

  redis-replica-2:
    image: redis:7-alpine
    container_name: redis-replica-2
    command: redis-server --port 6379 --requirepass redis123 --masterauth redis123 --replicaof redis-master 6379
    ports:
      - "6381:6379"
    volumes:
      - redis-replica2-data:/data
    networks:
      - redis-net
    depends_on:
      redis-master:
        condition: service_healthy

  sentinel-1:
    image: redis:7-alpine
    container_name: sentinel-1
    command: redis-sentinel /etc/sentinel.conf
    ports:
      - "26379:26379"
    volumes:
      - ./sentinel.conf:/etc/sentinel.conf
      - sentinel1-data:/data
    networks:
      - redis-net
    depends_on:
      - redis-master
      - redis-replica-1
      - redis-replica-2

  sentinel-2:
    image: redis:7-alpine
    container_name: sentinel-2
    command: redis-sentinel /etc/sentinel.conf
    ports:
      - "26380:26379"
    volumes:
      - ./sentinel.conf:/etc/sentinel.conf
      - sentinel2-data:/data
    networks:
      - redis-net
    depends_on:
      - redis-master

  sentinel-3:
    image: redis:7-alpine
    container_name: sentinel-3
    command: redis-sentinel /etc/sentinel.conf
    ports:
      - "26381:26379"
    volumes:
      - ./sentinel.conf:/etc/sentinel.conf
      - sentinel3-data:/data
    networks:
      - redis-net
    depends_on:
      - redis-master

volumes:
  redis-master-data:
  redis-replica1-data:
  redis-replica2-data:
  sentinel1-data:
  sentinel2-data:
  sentinel3-data:

networks:
  redis-net:
    driver: bridge
